name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs-check:
    name: Проверка документации
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверить наличие обязательных файлов
        run: |
          set -e
          for f in README.md CONTRIBUTING.md LICENSE .gitignore docs/CHANGELOG.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Отсутствует обязательный файл $f"
              exit 1
            fi
          done
          for f in docs/requirements.md docs/process.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Отсутствует обязательный документ $f"
              exit 1
            fi
          done
          echo "Все обязательные файлы на месте"

      - name: Проверить, что нет пробелов в конце строк
        run: |
          if grep -rnI --include='*.md' ' $' . ; then
            echo "::error::Найдены пробелы в конце строк"
            exit 1
          fi
          echo "Пробелов в конце строк нет"

      - name: Проверить, что файлы заканчиваются переводом строки
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "::error file=$f::Файл не заканчивается переводом строки"
              fail=1
            fi
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail

      - name: Проверить, что нет незакрытых конфликтов слияния
        run: |
          if grep -rnI -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.md' . ; then
            echo "::error::Найдены маркеры конфликта слияния"
            exit 1
          fi
          echo "Маркеров конфликта нет"

      - name: Проверить, что нет похожего на секреты
        run: |
          if grep -rnI -E '(api[_-]?key|secret|password|token)\s*[:=]\s*["'\'']?[A-Za-z0-9_-]{16,}' \
            --include='*.md' --include='*.yml' --include='*.yaml' . ; then
            echo "::error::Похоже на секрет в открытом виде"
            exit 1
          fi
          echo "Секретов не обнаружено"

      - name: Проверить оформление Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

      - name: Проверить записи о решениях
        run: |
          set -e
          fail=0
          [ -f docs/adr/README.md ] || { echo "::error::Нет указателя docs/adr/README.md"; exit 1; }
          for f in docs/adr/[0-9]*.md; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            grep -q "$base" docs/adr/README.md || { echo "::error file=$f::Запись не упоминается в указателе docs/adr/README.md"; fail=1; }
            grep -qE '^\- \*\*Статус\*\*: (Принято|Предложено|Заменено|Отклонено)' "$f" || { echo "::error file=$f::Не заполнен статус"; fail=1; }
            grep -q '^## Контекст' "$f" || { echo "::error file=$f::Нет раздела «Контекст»"; fail=1; }
            grep -q '^## Решение' "$f" || { echo "::error file=$f::Нет раздела «Решение»"; fail=1; }
            grep -q '^## Последствия' "$f" || { echo "::error file=$f::Нет раздела «Последствия»"; fail=1; }
          done
          exit $fail

      - name: Проверить диаграммы
        run: |
          set -e
          fail=0
          shopt -s nullglob globstar
          for f in docs/**/*.mmd docs/*.mmd; do
            head -1 "$f" | grep -qE '^(flowchart|sequenceDiagram|erDiagram|classDiagram|stateDiagram|gantt)' || { echo "::error file=$f::Первая строка не является типом диаграммы Mermaid"; fail=1; }
            [ -n "$(tail -c 1 "$f")" ] && { echo "::error file=$f::Файл не заканчивается переводом строки"; fail=1; }
            quotes=$(tr -cd '"' < "$f" | wc -c)
            [ $((quotes % 2)) -eq 0 ] || { echo "::error file=$f::Нечётное число кавычек — блок не разберётся"; fail=1; }
          done
          for f in $(grep -rl '```mermaid' --include='*.md' . 2>/dev/null || true); do
            blocks=$(grep -c '^```mermaid' "$f")
            fences=$(grep -c '^```' "$f")
            [ $((fences % 2)) -eq 0 ] || { echo "::error file=$f::Незакрытый блок кода"; fail=1; }
            [ $((fences - blocks * 2)) -eq 0 ] || echo "::warning file=$f::Блоки mermaid чередуются с другими языками — проверьте вручную"
          done
          exit $fail

      - name: Проверить незаполненные плейсхолдеры
        run: |
          if grep -rnI -E '<заполнить|TODO|TBD|XXX|FIXME|lorem ipsum' --include='*.md' . ; then
            echo "::error::Найдены незаполненные плейсхолдеры"
            exit 1
          fi
          echo "Плейсхолдеров нет"

      - name: Проверить относительные ссылки
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\([^)]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//' | grep -vE '^(https?:|mailto:|#)' || true); do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$f::Ссылка ведёт в никуда: $link"
                fail=1
              fi
            done
          done < <(find . -name '*.md' -not -path './.git/*')
          exit $fail
